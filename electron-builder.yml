appId: com.shinyegg.app
productName: Shiny Egg
directories:
  output: dist
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.renderer.json}'
  - '!snes-framework/**'
  # `snes-framework` is a workspace dep symlinked into node_modules, so
  # electron-builder would otherwise drag the WHOLE package in (and unpack it,
  # since it contains asar.exe) — including the extract outputs
  # (assets/build/editor-data/reference, ~80 MB). It's fully redundant: the
  # engine TS is bundled into the main process (electron.vite.config externalize
  # `exclude`), and its runtime inputs ship via `extraResources` →
  # resources/snes-framework. The root-level `!snes-framework/**` above does NOT
  # match this node_modules copy, so exclude it explicitly.
  - '!node_modules/snes-framework/**'
extraResources:
  # The on-disk inputs asar needs at runtime, plus the engine docs as bundled
  # reference material. The framework's TS is bundled into the Electron main
  # process; node config, extracted assets, build outputs, and reference carts
  # do not ship. The asar binary itself is platform-specific (asar.exe / asar /
  # asar-macos) and ships per-OS under win:/linux:/mac: below; its LGPL-3.0
  # license text ships on every platform (asar is invoked as a separate
  # executable, not linked).
  - from: snes-framework/asar-licenses
    to: snes-framework/asar-licenses
    filter:
      - '**/*'
  # M1TE — our fork of M1TE2 (the .NET SNES tile/map editor) for editing exported
  # .M1 graphics sessions. A Windows .exe (+ its .NET runtime .config); shipped on
  # BOTH platforms — run natively on Windows, via Wine on Linux — so it lives here in
  # the shared block, not the per-OS one. Its MIT license text rides alongside.
  - from: snes-framework/M1TE.exe
    to: snes-framework/M1TE.exe
  - from: snes-framework/M1TE.exe.config
    to: snes-framework/M1TE.exe.config
  - from: snes-framework/m1te-licenses
    to: snes-framework/m1te-licenses
    filter:
      - '**/*'
  - from: snes-framework/global
    to: snes-framework/global
    filter:
      - '**/*'
  - from: snes-framework/yi
    to: snes-framework/yi
    filter:
      - '**/*'
      - '!**/*.sfc'
      - '!**/*.smc'
  # Engine/reference docs (markdown + the memory-map TSV) the asm comments
  # cite. Not an asar build input — shipped read-only alongside yi/ so the
  # `docs/*.md` references in the asm resolve to on-disk files.
  - from: snes-framework/docs
    to: snes-framework/docs
    filter:
      - '**/*'
  # Built-in custom-patch repository (read-only; the editor lists + applies these).
  - from: snes-framework/patches
    to: snes-framework/patches
    filter:
      - '**/*'
  - from: bizhawk-harness
    to: bizhawk-harness
    filter:
      - '**/*'
win:
  executableName: shiny-egg
  # Default name for win targets; nsis overrides below. The `zip` target packs
  # the unpacked app (the same contents as dist/win-unpacked) → release artifact.
  artifactName: ${name}-${version}-win.${ext}
  # Windows-native assembler; the Linux build ships `asar` instead (see linux:).
  extraResources:
    - from: snes-framework/asar.exe
      to: snes-framework/asar.exe
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  # Single portable AppImage (x64). The runtime makes the bundled `asar` binary
  # executable on first use (resources are read-only; see runAsar's chmod).
  # BizHawk (Launch / Test Level) is user-provided via EmuHawk.sh, not bundled.
  artifactName: ${name}-${version}-linux.${ext}
  category: Development
  icon: resources/icon.png # 256x256; AppImage builds fine (electron-builder may warn it prefers 512)
  extraResources:
    - from: snes-framework/asar
      to: snes-framework/asar
  target:
    - target: AppImage
      arch:
        - x64
mac:
  # Universal (arm64 + x86_64) dmg + zip — one artifact runs on both Apple
  # Silicon and Intel Macs. The bundled asar (asar-macos) is itself a committed
  # universal Mach-O, so the ROM builder works on either arch.
  category: public.app-category.developer-tools
  icon: resources/icon.png # electron-builder needs a >=512px source to synth the .icns
  # Unsigned: no Apple Developer ID. electron-builder ad-hoc signs the merged
  # universal app so it runs after the user clears the download quarantine
  # (right-click -> Open, or `xattr -dr com.apple.quarantine <app>` — documented
  # in the README). identity:null makes "don't sign" explicit so CI doesn't fail
  # hunting the keychain for a cert.
  identity: null
  artifactName: ${name}-${version}-mac-${arch}.${ext} # arch = "universal"
  # macOS-native assembler (committed prebuilt, like asar.exe / asar).
  extraResources:
    - from: snes-framework/asar-macos
      to: snes-framework/asar-macos
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
