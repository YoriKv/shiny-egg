name: Release

# Push a version tag (e.g. `v0.1.0`) to build the Windows app and publish a
# GitHub Release with two artifacts:
#   - shiny-egg-<version>-setup.exe  (NSIS installer)
#   - shiny-egg-<version>-win.zip    (zipped portable app = win-unpacked contents)
# The release body is the matching `## v<version>` section of CHANGELOG.md
# (auto-generated commit notes are appended after it; if the section is
# missing, the release falls back to the auto notes alone).
# A manual run (workflow_dispatch) just builds and uploads the artifacts to the
# run (no release), handy for testing the build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows app (NSIS installer + zip)
        run: pnpm run build:win

      # Tag push → pull this version's section out of CHANGELOG.md for the
      # release body. Matches the heading's second field against the tag
      # (`## v0.3.5 — …`), so the trailing date/"unreleased" note is ignored.
      # No matching section ⇒ empty file ⇒ auto-generated notes only.
      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { on = ($2 == tag) ; next }
            on' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no \"## ${GITHUB_REF_NAME}\" section — release body will be auto-generated notes only."
          fi

      # Tag push → publish a release with exactly the two artifacts.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*-setup.exe
            dist/*-win.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Manual run → keep the artifacts on the workflow run for inspection.
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: shiny-egg-win
          path: |
            dist/*-setup.exe
            dist/*-win.zip
