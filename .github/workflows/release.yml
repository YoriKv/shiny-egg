name: Release

# Push a version tag (e.g. `v0.1.0`) to build the app for Windows, Linux + macOS
# and publish a GitHub Release with the artifacts:
#   - shiny-egg-<version>-setup.exe           (Windows NSIS installer)
#   - shiny-egg-<version>-win.zip             (zipped portable app = win-unpacked contents)
#   - shiny-egg-<version>-linux.AppImage      (portable Linux app)
#   - shiny-egg-<version>-mac-universal.dmg   (macOS disk image, arm64 + x64)
#   - shiny-egg-<version>-mac-universal.zip   (zipped macOS .app, arm64 + x64)
# The release body is the matching `## v<version>` section of CHANGELOG.md
# (auto-generated commit notes are appended after it; if the section is
# missing, the release falls back to the auto notes alone).
#
# Structure: a per-OS `build` matrix always uploads its artifacts to the run; a
# single `release` job (tag push only) downloads them all and publishes ONE
# release — so the two OS builds never race to create the same release.
# A manual run (workflow_dispatch) runs only the build matrix (no release),
# handy for testing the build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifacts: |
              dist/*-setup.exe
              dist/*-win.zip
          - os: ubuntu-latest
            script: build:linux
            artifacts: |
              dist/*-linux.AppImage
          - os: macos-latest
            script: build:mac
            artifacts: |
              dist/*-mac-universal.dmg
              dist/*-mac-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fresh per-OS install pulls the correct platform electron binary. (The
      # CLAUDE.md "install from Windows only" caveat is about the shared
      # WSL/Windows dev tree, not a clean CI runner.)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run ${{ matrix.script }}

      # Always keep per-OS artifacts on the run: the release job downloads them
      # (tag push), and a manual run leaves them here for inspection.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiny-egg-${{ matrix.os }}
          path: ${{ matrix.artifacts }}

  release:
    # Tag push only: gather both OS builds and publish a single release.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Pull this version's section out of CHANGELOG.md for the release body.
      # Matches the heading's second field against the tag (`## v0.3.5 — …`), so
      # the trailing date/"unreleased" note is ignored. No matching section ⇒
      # empty file ⇒ auto-generated notes only.
      - name: Extract changelog section
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { on = ($2 == tag) ; next }
            on' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no \"## ${GITHUB_REF_NAME}\" section — release body will be auto-generated notes only."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/**/*-setup.exe
            artifacts/**/*-win.zip
            artifacts/**/*-linux.AppImage
            artifacts/**/*-mac-universal.dmg
            artifacts/**/*-mac-universal.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Mirror the docs/ tutorial to this repo's GitHub wiki on each release. Runs
  # independently of `release` (a wiki hiccup never blocks a release) but only
  # after a green build, and only on a tag push. Auth is the built-in
  # GITHUB_TOKEN — `contents: write` (declared above) covers wiki pushes, so no
  # secret is needed, but the wiki MUST already be initialized (Settings →
  # Wikis, with one page created via the web UI once); a push to a wiki that has
  # never been created fails with "repository not found".
  publish-wiki:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Clone wiki
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Build wiki pages from docs/
        run: node scripts/publish-wiki.ts --out wiki --repo "${{ github.repository }}"

      - name: Commit + push wiki
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date — nothing to push."
          else
            git commit -m "Docs sync for ${GITHUB_REF_NAME}"
            git push
          fi
